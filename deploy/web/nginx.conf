worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Assets are compressed once by the verified packager; no on-the-fly changes.
    gzip off;
    gzip_static off;
    map $status $runtime_cache {
        default "no-store";
        200 "public, max-age=31536000, immutable";
        206 "public, max-age=31536000, immutable";
        304 "public, max-age=31536000, immutable";
    }

    # Resolve ranges and conditional responses before applying wire encodings.
    # Nginx's add_header runs before its range filter: serving files directly
    # would keep a br header on plain-text 416 errors. This loopback-only static
    # listener supplies the final status to the public proxy, without modules.
    server {
        listen 127.0.0.1:8081;
        server_name _;
        root /srv/chess-web;
        access_log off;
        autoindex off;
        etag on;
        location ~ \.wasm(\.br)?$ {
            types { }
            default_type application/wasm;
            try_files $uri =404;
        }
        location ~ \.js(\.br)?$ {
            types { }
            default_type application/javascript;
            try_files $uri =404;
        }
        location ~ \.tar\.gz$ {
            types { }
            default_type application/gzip;
            try_files $uri =404;
        }
        location ~ /(?:AUTHORS|[^/]+\.(?:txt|md))$ {
            types { }
            default_type text/plain;
            try_files $uri =404;
        }
        location / { try_files $uri =404; }
    }

    server {
        listen 8080;
        server_name _;
        root /srv/chess-web;
        autoindex off;
        absolute_redirect off;
        etag on;
        # The backend alone handles Range; do not filter an upstream 200 twice.
        max_ranges 0;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /jogar/runtime/manifest.json {
            default_type application/json;
            # Mutable pointer: never return a stale conditional response.
            etag off;
            if_modified_since off;
            try_files $uri =404;
        }
        location = /jogar/runtime/release.json {
            default_type application/json;
            etag off;
            if_modified_since off;
            try_files $uri =404;
        }
        # Generated exact locations include MIME, cache and Content-Encoding.
        # add_header encoding deliberately excludes 4xx/5xx; no SPA catchall.
        include /etc/nginx/runtime-assets.conf;
        location / { return 404; }
    }
}
