worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Unity requests explicit .gz URLs. Never recompress or negotiate substitutes.
    gzip off;
    gzip_static off;
    map $uri $unity_content_encoding {
        default "";
        ~\.(data|symbols\.json|wasm|js)\.gz$ gzip;
    }

    server {
        listen 8080;
        server_name _;
        root /srv/chess-web;
        index index.html;
        autoindex off;
        # Traefik terminates HTTPS; any directory redirect stays relative.
        absolute_redirect off;

        # Names are stable between releases, so every use requires revalidation.
        etag on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Without "always": a missing .gz must not label its HTML error as gzip.
        add_header Content-Encoding $unity_content_encoding;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Unity's Safari workaround for precompressed data, per Unity 6.3 docs.
        # https://docs.unity3d.com/6000.3/Documentation/Manual/web-server-config-nginx.html
        location ~ \.(data|symbols\.json)\.gz$ {
            types { }
            default_type application/gzip;
            try_files $uri =404;
        }

        location ~ \.wasm(\.gz)?$ {
            types { }
            default_type application/wasm;
            try_files $uri =404;
        }

        location ~ \.js(\.gz)?$ {
            types { }
            default_type application/javascript;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
