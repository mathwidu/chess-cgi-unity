name: Publish verified Unity Web image

# Publishing is manual. Push/PR never deploy the game.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: 'Full approved source commit (40 hex characters)'
        required: true
        type: string
      bundle_sha256:
        description: 'SHA256 of chess-web-<source12>.tar.gz from the reviewed plan'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chess-web-publish
  cancel-in-progress: false

jobs:
  quality_build_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      IMAGE_NAME: ghcr.io/mathwidu/chess-cgi-unity-web
    steps:
      - name: Validate manual inputs
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == 'mathwidu/chess-cgi-unity' ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check release tooling and real AI
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          python3 -m unittest discover -s tools/tests -p 'test_web_*.py'
          python3 -m unittest discover -s tools/tests -p 'test_setup_stockfish_web.py'
          python3 tools/setup_stockfish_web.py
          python3 -m unittest tools.tests.test_site_pilot
          node --test tools/tests/stockfish_web_bridge.test.cjs tools/tests/session_web_bridge.test.cjs
      - name: Download and verify the approved local Unity build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${SOURCE_REVISION:0:12}"
          gh release download "web-$short" --repo "$GITHUB_REPOSITORY" --pattern "chess-web-$short.tar.gz" --dir "$RUNNER_TEMP/bundle"
          python3 tools/web_release.py unpack --archive "$RUNNER_TEMP/bundle/chess-web-$short.tar.gz" --sha256 "$BUNDLE_SHA256" --output-dir "$RUNNER_TEMP/context" --revision "$SOURCE_REVISION"
      - name: Build Linux amd64 image
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$SOURCE_REVISION" --label "com.chess-cgi.bundle-sha256=$BUNDLE_SHA256" -f "$RUNNER_TEMP/context/deploy/web/Dockerfile" -t "$IMAGE_NAME:sha-$SOURCE_REVISION" "$RUNNER_TEMP/context"
      - name: Test the exact image before publication
        shell: bash
        run: |
          docker run -d --name chess-web-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --memory 128m --cpus 0.50 -p 127.0.0.1:8091:8080 "$IMAGE_NAME:sha-$SOURCE_REVISION"
          trap 'docker rm -f chess-web-ci >/dev/null' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            curl --fail --silent http://127.0.0.1:8091/healthz && break
            sleep 1
          done
          python3 tools/tests/test_web_container.py --url http://127.0.0.1:8091 --web-root "$RUNNER_TEMP/context/web"
      - name: Publish only after the same image passes
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 - <<'PY'
          import os, subprocess
          image = os.environ['IMAGE_NAME'] + ':sha-' + os.environ['SOURCE_REVISION']
          result = subprocess.run(['docker', 'manifest', 'inspect', image], capture_output=True, text=True, timeout=30)
          assert result.returncode != 0, 'Tag already exists; do not replace the reviewed artifact'
          assert any(term in result.stderr.lower() for term in ('no such manifest', 'not found', 'manifest unknown', '404')), 'Tag absence not proven'
          PY
          docker push "$IMAGE_NAME:sha-$SOURCE_REVISION"
          image_ref="$(docker image inspect "$IMAGE_NAME:sha-$SOURCE_REVISION" --format '{{index .RepoDigests 0}}')"
          [[ "$image_ref" =~ ^ghcr.io/mathwidu/chess-cgi-unity-web@sha256:[0-9a-f]{64}$ ]]
          {
            printf 'Source: %s\n\nBundle: %s\n\nImage: %s\n\n' "$SOURCE_REVISION" "$BUNDLE_SHA256" "$image_ref"
            python3 -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/context/web/jogar/runtime/release.json')); print('Build ID: '+p['build_id'])"
            printf 'The VPS was not modified. Supply this SHA, digest and build ID to the coordinated cicochess-site release after approval.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary registry login
        if: always()
        run: docker logout ghcr.io
