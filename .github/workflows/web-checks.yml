name: Web deployment checks

on:
  push:
    branches: [main, 'codex/**']
    paths: ['deploy/web/**', 'tools/*web*', 'tools/tests/*web*', '.github/workflows/web-*.yml']
  pull_request:
    paths: ['deploy/web/**', 'tools/*web*', 'tools/tests/*web*', '.github/workflows/web-*.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Release and deployment guard tests
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_web_*.py'
          python3 -m unittest discover -s tools/tests -p 'test_setup_stockfish_web.py'
          python3 -m unittest tools.tests.test_site_pilot
          python3 -m py_compile tools/web_release.py tools/deploy_web.py
      - name: Real pinned Stockfish WASM
        run: |
          python3 tools/setup_stockfish_web.py
          node --test tools/tests/stockfish_web_bridge.test.cjs tools/tests/session_web_bridge.test.cjs
      - name: Validate the runtime integration plan without deploying
        run: python3 tools/deploy_web.py plan --image "ghcr.io/mathwidu/chess-cgi-unity-web@sha256:$(printf '%064d' 0)" --revision "$GITHUB_SHA" --build-id "$(printf '%064d' 0)"
